<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FPS Lab 3.0 — منصة متكاملة لتحليل أداء الألعاب، عنق الزجاجة، DLSS/FSR/XeSS، الترقية، التوافق، مستكشف الأعطال، وحفظ التجميعات.">
  <meta name="keywords" content="FPS Lab 3.0, FPS benchmark, bottleneck analyzer, DLSS, FSR, XeSS, PC builder, game requirements">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="FPS Lab 3.0 | Game Performance & Hardware Platform">
  <meta property="og:description" content="تحليل FPS و 1% Low، فحص التوافق، مستشار الترقية، مستكشف الأعطال، وحفظ ومشاركة التجميعات.">
  <meta property="og:type" content="website">
  <title>FPS Lab 3.0 | منصة تحليل أداء الألعاب والعتاد</title>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "FPS Lab 3.0",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web",
      "description": "Platform for gaming performance estimation, bottleneck analysis, upscaling simulation, compatibility checking, and build saving."
    }
  </script>
  <style>
    :root {
      --bg-body: radial-gradient(circle at top, #1b2842 0%, #070b14 75%);
      --bg-card: rgba(20, 30, 48, 0.94);
      --bg-inner: #0d1524;
      --bg-input: #080e1a;
      --border: #2a3d5e;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-label: #cbd5e1;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }

    body.theme-neon {
      --bg-body: radial-gradient(circle at top, #251042 0%, #070410 75%);
      --bg-card: rgba(27, 14, 48, 0.94);
      --bg-inner: #120922;
      --bg-input: #090412;
      --border: #5b21b6;
      --text-main: #fdf4ff;
      --text-muted: #c4b5fd;
      --text-label: #e9d5ff;
      --accent: #9333ea;
      --accent-hover: #7e22ce;
    }

    body.theme-light {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-inner: #f8fafc;
      --bg-input: #f8fafc;
      --border: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-label: #334155;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 12px 36px;
      overflow-x: hidden;
      transition: background 0.2s, color 0.2s;
    }

    .container { max-width: 1240px; margin: 0 auto; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .brand { font-weight: 800; font-size: 18px; color: #38bdf8; }
    .top-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .hero { text-align: center; margin-bottom: 16px; }
    .hero h1 { font-size: clamp(21px, 4vw, 31px); margin-bottom: 6px; }
    .hero p { color: var(--text-muted); font-size: clamp(13px, 2vw, 15px); }

    .disclaimer-box {
      margin-top: 10px;
      display: inline-block;
      background: rgba(234, 179, 8, 0.14);
      border: 1px solid rgba(250, 204, 21, 0.4);
      color: #fde047;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 10px;
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 14px;
    }

    .tab-btn {
      padding: 8px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-label);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-hd {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(285px, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .grid-specs { display: grid; grid-template-columns: repeat(auto-fit, minmax(195px, 1fr)); gap: 12px; }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--text-label);
      margin-bottom: 5px;
      font-weight: 600;
    }

    select, input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }

    select:focus, input:focus, textarea:focus { border-color: var(--accent); }

    .quick-search { margin-bottom: 6px; padding: 6px 9px !important; font-size: 12px !important; }
    .meta-txt { font-size: 11px; color: #38bdf8; margin-top: 4px; line-height: 1.4; }

    .btn {
      padding: 8px 13px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
    }

    .btn:hover { background: var(--accent-hover); }
    .btn-sm { padding: 6px 10px; font-size: 12px; min-height: 33px; border-radius: 8px; }
    .btn-green { background: #16a34a; }
    .btn-green:hover { background: #15803d; }
    .btn-purple { background: #7c3aed; }
    .btn-purple:hover { background: #6d28d9; }
    .btn-amber { background: #d97706; }
    .btn-amber:hover { background: #b45309; }
    .btn-red { background: #dc2626; }
    .btn-red:hover { background: #b91c1c; }
    .btn-outline { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); }
    .btn-outline:hover { border-color: #38bdf8; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }

    .box {
      background: var(--bg-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 12.5px;
      line-height: 1.65;
    }

    .status { margin-top: 8px; font-size: 12.5px; color: #4ade80; min-height: 18px; }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 13px;
      margin-top: 12px;
    }

    .game-card {
      background: var(--bg-inner);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    .game-card.fav { border-color: #eab308; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .game-name { font-size: 14.5px; font-weight: 800; }

    .pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
    }

    .p-good { background: rgba(34, 197, 94, 0.16); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.35); }
    .p-mid { background: rgba(234, 179, 8, 0.16); color: #facc15; border: 1px solid rgba(250, 204, 21, 0.35); }
    .p-bad { background: rgba(239, 68, 68, 0.16); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.35); }
    .p-info { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.35); }

    .fps-big { font-size: 18px; font-weight: 800; }
    .muted { font-size: 11.5px; color: var(--text-muted); line-height: 1.5; }
    .low1 { font-size: 12px; color: #38bdf8; font-weight: 700; }

    .track { width: 100%; height: 7px; background: var(--bg-input); border-radius: 999px; overflow: hidden; }
    .fill { height: 100%; border-radius: 999px; }

    .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: start; }
    .tbl th { color: #38bdf8; font-weight: 800; }

    .list-item {
      background: var(--bg-inner);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    #chartCanvas { width: 100%; height: 240px; display: block; }

    .footer {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12.5px;
    }

    @media (max-width: 600px) {
      body { padding: 10px 8px 28px; }
      .card { padding: 12px; border-radius: 13px; }
      .games-grid { grid-template-columns: 1fr; }
      .top-actions .btn, .btn-row .btn { flex: 1 1 calc(50% - 6px); }
      #chartCanvas { height: 195px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="brand">⚡ FPS Lab 3.0</div>
      <div class="top-actions">
        <button class="btn btn-outline btn-sm" id="themeBtn" type="button"></button>
        <button class="btn btn-outline btn-sm" id="langBtn" type="button"></button>
        <button class="btn btn-red btn-sm" id="resetBtn" type="button"></button>
      </div>
    </div>

    <header class="hero">
      <h1 id="heroTitle"></h1>
      <p id="heroSub"></p>
      <div class="disclaimer-box" id="disclaimerBox"></div>
    </header>

    <nav class="tabs" id="tabsBar">
      <button class="tab-btn active" data-tab="lab" id="tabLab" type="button"></button>
      <button class="tab-btn" data-tab="analysis" id="tabAnalysis" type="button"></button>
      <button class="tab-btn" data-tab="rankings" id="tabRankings" type="button"></button>
      <button class="tab-btn" data-tab="tools" id="tabTools" type="button"></button>
    </nav>

    <!-- العتاد والمواصفات المشتركة -->
    <section class="card">
      <div class="card-hd">
        <span id="specsTitle"></span>
        <button class="btn btn-purple btn-sm" id="detectBtn" type="button"></button>
      </div>

      <div class="grid-specs">
        <div class="field">
          <label for="gpuSelect" id="lblGpu"></label>
          <input type="text" class="quick-search" id="gpuFilter" maxlength="40">
          <select id="gpuSelect"></select>
          <div class="meta-txt" id="gpuMeta"></div>
        </div>

        <div class="field">
          <label for="cpuSelect" id="lblCpu"></label>
          <input type="text" class="quick-search" id="cpuFilter" maxlength="40">
          <select id="cpuSelect"></select>
          <div class="meta-txt" id="cpuMeta"></div>
        </div>

        <div class="field">
          <label for="ramSelect" id="lblRam"></label>
          <select id="ramSelect">
            <option value="4">4 GB</option>
            <option value="8">8 GB</option>
            <option value="16" selected>16 GB</option>
            <option value="24">24 GB</option>
            <option value="32">32 GB</option>
            <option value="64">64 GB</option>
          </select>
        </div>

        <div class="field">
          <label for="resSelect" id="lblRes"></label>
          <select id="resSelect">
            <option value="1" selected>1080p (FHD)</option>
            <option value="0.72">1440p (2K)</option>
            <option value="0.45">2160p (4K)</option>
          </select>
        </div>

        <div class="field">
          <label for="hzSelect" id="lblHz"></label>
          <select id="hzSelect">
            <option value="60" selected>60 Hz</option>
            <option value="120">120 Hz</option>
            <option value="144">144 Hz</option>
            <option value="240">240 Hz</option>
            <option value="360">360 Hz</option>
          </select>
        </div>

        <div class="field">
          <label for="presetSelect" id="lblPreset"></label>
          <select id="presetSelect">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high" selected>High</option>
            <option value="ultra">Ultra</option>
          </select>
        </div>

        <div class="field">
          <label for="upscaleSelect" id="lblUpscale"></label>
          <select id="upscaleSelect"></select>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-outline btn-sm" id="obsBtn" type="button"></button>
        <button class="btn btn-outline btn-sm" id="modsBtn" type="button"></button>
        <button class="btn btn-outline btn-sm" id="rtBtn" type="button"></button>
        <button class="btn btn-green btn-sm" id="saveSnapBtn" type="button"></button>
        <button class="btn btn-outline btn-sm" id="shareBtn" type="button"></button>
      </div>

      <div class="box" id="detectBox" style="margin-top:10px;"></div>

      <div class="btn-row">
        <input type="text" id="buildName" maxlength="40" style="max-width:230px;">
        <button class="btn btn-green btn-sm" id="saveBuildBtn" type="button"></button>
        <button class="btn btn-outline btn-sm" id="toggleJsonBtn" type="button"></button>
      </div>
      <div id="buildsList" style="margin-top:8px;"></div>

      <div id="jsonPanel" style="display:none; margin-top:10px;" class="box">
        <textarea id="jsonBox" maxlength="35000"></textarea>
        <div class="btn-row">
          <button class="btn btn-outline btn-sm" id="copyJsonBtn" type="button"></button>
          <button class="btn btn-green btn-sm" id="loadJsonBtn" type="button"></button>
        </div>
      </div>

      <div class="status" id="statusBar"></div>
    </section>

    <!-- 1. الألعاب والمتطلبات -->
    <div class="panel active" id="panel-lab">
      <section class="card">
        <div class="card-hd"><span id="finderTitle"></span></div>
        <div class="grid-3">
          <div class="field">
            <label for="gameSearch" id="lblSearch"></label>
            <input type="text" id="gameSearch" maxlength="80">
          </div>
          <div class="field">
            <label for="catFilter" id="lblCat"></label>
            <select id="catFilter"></select>
          </div>
          <div class="field">
            <label for="sortFilter" id="lblSort"></label>
            <select id="sortFilter"></select>
          </div>
        </div>

        <div class="card-hd" style="margin-top:14px;"><span id="addGameTitle"></span></div>
        <div class="grid-3">
          <div class="field">
            <label for="newTitle" id="lblNewTitle"></label>
            <input type="text" id="newTitle" maxlength="70">
          </div>
          <div class="field">
            <label for="newFps" id="lblNewFps"></label>
            <select id="newFps">
              <option value="110">~110</option>
              <option value="72" selected>~72</option>
              <option value="52">~52</option>
            </select>
          </div>
          <div class="field">
            <label for="newRam" id="lblNewRam"></label>
            <select id="newRam">
              <option value="8">8 GB</option>
              <option value="16" selected>16 GB</option>
              <option value="32">32 GB</option>
            </select>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-green btn-sm" id="addGameBtn" type="button"></button>
        </div>
      </section>

      <section class="games-grid" id="gamesGrid"></section>
    </div>

    <!-- 2. التحليل والترقية والتوافق والحرارة -->
    <div class="panel" id="panel-analysis">
      <section class="card">
        <div class="card-hd"><span id="diagTitle"></span></div>
        <div class="grid-2" id="diagGrid"></div>
      </section>

      <section class="card">
        <div class="card-hd"><span id="upgTitle"></span></div>
        <div class="field" style="max-width:340px; margin-bottom:10px;">
          <label for="targetGpu" id="lblTargetGpu"></label>
          <select id="targetGpu"></select>
        </div>
        <div class="grid-2" id="upgGrid"></div>
      </section>
    </div>

    <!-- 3. الرسوم والترتيب -->
    <div class="panel" id="panel-rankings">
      <section class="card">
        <div class="card-hd"><span id="chartTitle"></span></div>
        <div class="grid-2" style="margin-bottom:10px;">
          <div class="field">
            <label for="chartGame" id="lblChartGame"></label>
            <select id="chartGame"></select>
          </div>
          <div class="field">
            <label for="chartMode" id="lblChartMode"></label>
            <select id="chartMode"></select>
          </div>
        </div>
        <div class="box">
          <canvas id="chartCanvas" width="900" height="240"></canvas>
        </div>
      </section>

      <section class="card">
        <div class="card-hd"><span id="rankTitle"></span></div>
        <div class="grid-2">
          <div class="box" id="gpuRankBox"></div>
          <div class="box" id="cpuRankBox"></div>
        </div>
      </section>
    </div>

    <!-- 4. الأعطال والمجتمع وسجل FPS -->
    <div class="panel" id="panel-tools">
      <section class="card">
        <div class="card-hd"><span id="troubleTitle"></span></div>
        <div class="field" style="max-width:340px; margin-bottom:10px;">
          <label for="troubleSelect" id="lblTrouble"></label>
          <select id="troubleSelect"></select>
        </div>
        <div class="box" id="troubleBox"></div>
      </section>

      <section class="card">
        <div class="card-hd"><span id="commTitle"></span></div>
        <div class="grid-3">
          <div class="field">
            <label for="commGame" id="lblCommGame"></label>
            <input type="text" id="commGame" maxlength="60">
          </div>
          <div class="field">
            <label for="commAvg" id="lblCommAvg"></label>
            <input type="number" id="commAvg" min="10" max="400" value="65">
          </div>
          <div class="field">
            <label for="commLow" id="lblCommLow"></label>
            <input type="number" id="commLow" min="5" max="350" value="46">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn btn-purple btn-sm" id="addCommBtn" type="button"></button>
        </div>
        <div id="commList" style="margin-top:10px;"></div>
      </section>

      <section class="card">
        <div class="card-hd">
          <span id="histTitle"></span>
          <button class="btn btn-red btn-sm" id="clearHistBtn" type="button"></button>
        </div>
        <div id="histList"></div>
      </section>
    </div>

    <footer class="footer">
      <div id="footLeft"></div>
      <div id="footRight"></div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
